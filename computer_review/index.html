<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コンピュータ概論Ⅰ ふりかえりラボ</title>
<meta name="description" content="コンピュータ概論Ⅱ 第1回：前期（コンピュータ概論Ⅰ）の6分野（ハードウェア・デジタルデータ・ファイルとディレクトリ・OSとアプリケーション・表計算・データベース）を、アニメーションと体験コーナー、クイズで自主的に復習する教材。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* ============================================================
   コンピュータ概論Ⅰ ふりかえりラボ  style.css
   ライトテーマ・教室のプロジェクタでも見やすいコントラスト
   ============================================================ */
:root{
  color-scheme:light;
  --bg:#f4f6fb; --bg2:#e9edf6; --paper:#ffffff; --paper2:#f8f9fd;
  --line:#dde3ef; --line2:#c4cde0;
  --text:#1c2333; --muted:#5b6579; --faint:#8b95a8;
  --ink:#233a7d;
  --c1:#3b7be9; --c1s:#e5efff;   /* ハードウェア */
  --c2:#8b5cf6; --c2s:#f0e9ff;   /* デジタルデータ */
  --c3:#f0a020; --c3s:#fff3dc;   /* ファイル */
  --c4:#22a36b; --c4s:#e2f7ec;   /* OS */
  --c5:#0e9fb0; --c5s:#dff6f8;   /* 表計算 */
  --c6:#e5567a; --c6s:#ffe6ec;   /* データベース */
  --ok:#1f9d61; --ng:#d9484f; --warn:#e08a00;
  --okbg:#e6f7ee; --oktx:#166a41; --okln:#9bd7b6;
  --ngbg:#fdecec; --ngtx:#9b2c31; --ngln:#f2b3b6;
  --warnbg:#fff3dc; --warntx:#8a5200; --pinkbg:#ffe6ec;
  --readout-bg:#1c2333; --readout-tx:#e8eefc;
  --accent:var(--c1); --accent-soft:var(--c1s);
  --display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --r:18px; --r2:12px;
  --shadow:0 10px 30px rgba(30,45,90,.08), 0 1px 2px rgba(30,45,90,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0f1420; --bg2:#1a2132; --paper:#161d2c; --paper2:#1b2334; --line:#2a3448; --line2:#3a4660;
    --text:#e6ebf5; --muted:#a3adc2; --faint:#7b8599; --ink:#c7d3ff;
    --c1s:#1c2c4d; --c2s:#2b2250; --c3s:#3d2e14; --c4s:#143224; --c5s:#0f3238; --c6s:#3f1c28;
    --okbg:#143224; --oktx:#8fe0b4; --okln:#2e6b4b; --ngbg:#3f1c22; --ngtx:#ffb3b8; --ngln:#7a3a40;
    --warnbg:#3d2e14; --warntx:#ffd08a; --pinkbg:#3f1c28; --shadow:0 10px 30px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.4);}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0f1420; --bg2:#1a2132; --paper:#161d2c; --paper2:#1b2334; --line:#2a3448; --line2:#3a4660;
  --text:#e6ebf5; --muted:#a3adc2; --faint:#7b8599; --ink:#c7d3ff;
  --c1s:#1c2c4d; --c2s:#2b2250; --c3s:#3d2e14; --c4s:#143224; --c5s:#0f3238; --c6s:#3f1c28;
  --okbg:#143224; --oktx:#8fe0b4; --okln:#2e6b4b; --ngbg:#3f1c22; --ngtx:#ffb3b8; --ngln:#7a3a40;
  --warnbg:#3d2e14; --warntx:#ffd08a; --pinkbg:#3f1c28; --shadow:0 10px 30px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.8;-webkit-text-size-adjust:100%;overflow-x:hidden;min-height:100vh}
h1,h2,h3,h4{font-family:var(--display);font-weight:900;margin:0;line-height:1.3;letter-spacing:.01em;text-wrap:balance}
h1{font-size:clamp(26px,4vw,40px)}
h2{font-size:clamp(22px,3vw,30px)}
h3{font-size:clamp(17px,2.2vw,21px);font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font-family:inherit}
:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13.5px;line-height:1.7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
kbd{font-family:var(--mono);font-size:.85em;background:var(--paper2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:1px 6px}
code{font-family:var(--mono);font-size:.92em;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
mark{background:#fff2a8;color:#1c2333;border-radius:4px;padding:0 3px}

/* ---------- layout ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1480px;margin-inline:auto;padding:10px clamp(16px,4vw,32px);display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:900;font-size:17px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;color:#fff;font-size:16px}
.topbar .spacer{flex:1}
.progress-pill{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.progress-pill .bar{width:110px;height:8px;background:var(--bg2);border-radius:999px;overflow:hidden}
.progress-pill .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c4));border-radius:999px;transition:width .5s}
.page{max-width:1480px;margin-inline:auto;padding:clamp(18px,3vw,36px) clamp(16px,4vw,32px) 80px}
.view{animation:fadeup .35s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2.4vw,26px);box-shadow:var(--shadow)}
.card.soft{background:var(--paper2);box-shadow:none}
.eyebrow{font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:12px}

/* ---------- buttons ---------- */
.btn{font:inherit;font-size:15px;font-weight:700;background:var(--paper);color:var(--text);border:1px solid var(--line2);border-radius:12px;padding:10px 18px;cursor:pointer;line-height:1.3;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,background .15s,border-color .15s,box-shadow .2s;text-decoration:none}
.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{font-size:13.5px;padding:7px 13px;border-radius:10px}
.btn.lg{font-size:17px;padding:14px 26px;border-radius:14px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px;background:var(--bg2);padding:4px;border-radius:12px}
.seg button{font:inherit;font-size:14px;font-weight:700;background:transparent;color:var(--muted);border:0;border-radius:9px;padding:6px 14px;cursor:pointer;transition:.15s}
.seg button.on{background:var(--paper);color:var(--accent);box-shadow:0 2px 8px rgba(30,45,90,.12)}
.chip{font:inherit;font-size:14px;font-weight:700;background:var(--paper);border:2px solid var(--line2);border-radius:999px;padding:7px 14px;cursor:pointer;transition:.15s;color:var(--text)}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.ok{background:var(--okbg);border-color:var(--ok);color:var(--oktx)}
.chip.ng{background:var(--ngbg);border-color:var(--ng);color:var(--ngtx)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=text],input[type=number],select,textarea{font:inherit;font-size:15px;padding:9px 12px;border:1.5px solid var(--line2);border-radius:10px;background:var(--paper);color:var(--text);min-width:0}
input[type=text]:focus,input[type=number]:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{font-family:var(--mono);line-height:1.6}

/* ---------- home ---------- */
.hero{display:grid;gap:18px;grid-template-columns:1.2fr .8fr;align-items:center;margin-bottom:28px}
.hero .lead{font-size:17px;color:var(--muted)}
.hero .art{justify-self:center;width:min(100%,360px)}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero .art{width:min(100%,260px)}}
.chapters{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.chcard{position:relative;display:grid;gap:10px;padding:20px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:transform .15s,box-shadow .2s;overflow:hidden;color:var(--text);font:inherit}
.chcard:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(30,45,90,.14)}
.chcard::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--accent)}
.chcard .icon{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.topbar{background:color-mix(in srgb,var(--paper) 86%,transparent)}
.chnav{background:color-mix(in srgb,var(--bg) 92%,transparent)}
.chcard .icon svg{width:34px;height:34px}
.chcard h3{font-size:19px}
.chcard .no{font-family:var(--display);font-weight:900;color:var(--accent);font-size:13px;letter-spacing:.1em}
.chcard .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.chcard .pbar{height:6px;background:var(--bg2);border-radius:999px;overflow:hidden}
.chcard .pbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .5s}
.chcard .badge{position:absolute;top:14px;right:14px;font-size:22px}
.final-cta{margin-top:26px;display:grid;gap:16px;grid-template-columns:1fr auto;align-items:center;background:linear-gradient(135deg,#1d2b64,#3b4ea8);color:#fff;border-radius:var(--r);padding:clamp(18px,3vw,28px)}
.final-cta h2{color:#fff}
.final-cta p{color:#d6dcff}
.final-cta .btn{white-space:nowrap}
@media (max-width:640px){.final-cta{grid-template-columns:1fr}}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.bdg{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-size:14px;font-weight:700}
.bdg.locked{opacity:.4;filter:grayscale(1)}
.bdg .e{font-size:22px}

/* ---------- chapter ---------- */
.chhead{display:flex;gap:16px;align-items:center;margin-bottom:8px}
.chhead .icon{width:64px;height:64px;border-radius:18px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);flex:none}
.chhead .icon svg{width:40px;height:40px}
.chnav{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:40;backdrop-filter:blur(8px);padding:8px 0;margin:10px -4px 18px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chnav::-webkit-scrollbar{display:none}
.chnav a{flex:none;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--muted);text-decoration:none;white-space:nowrap}
.chnav a.done{border-color:var(--accent);color:var(--accent)}
.chnav a.done::before{content:"✓ "}
.sec{margin-bottom:26px;scroll-margin-top:120px}
.sec .card{display:grid;gap:14px}
.sec h2{display:flex;gap:10px;align-items:baseline}
.sec h2 .n{font-size:14px;color:var(--accent);letter-spacing:.1em}
.prose{display:grid;gap:.75em}
.prose ul,.prose ol{margin:0;padding-left:1.4em}
.prose li{margin-block:.15em}
.prose table{border-collapse:collapse;width:100%;font-size:15px}
.prose th,.prose td:first-child{white-space:nowrap}
.tblwrap{overflow-x:auto;max-width:100%}
.prose th,.prose td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.prose th{background:var(--paper2);font-weight:700}
.point{border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:12px 16px;display:grid;gap:4px}
.point b{color:var(--accent)}
.why{border:1.5px dashed var(--line2);border-radius:12px;padding:12px 16px;background:var(--paper2)}
.why summary{cursor:pointer;font-weight:700;color:var(--ink)}
.lab{border:2px solid var(--accent-soft);background:linear-gradient(180deg,var(--paper),var(--paper2));border-radius:16px;padding:16px;display:grid;gap:12px}
.lab .lab-title{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:900;color:var(--accent);font-size:15px}
.lab .lab-title::before{content:"🔬"}
.fig{display:block;width:100%;max-width:860px;height:auto;background:#fff;border-radius:12px}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr;align-items:start}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.secfoot{display:flex;justify-content:flex-end}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;user-select:none}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.chend{margin-top:30px;text-align:center;display:grid;gap:12px;justify-items:center}
.readout{font-family:var(--mono);font-size:15px;background:var(--readout-bg);color:var(--readout-tx);border-radius:12px;padding:12px 16px;overflow-x:auto;line-height:1.7}
.readout b{color:#ffd166}
.readout .hl{color:#8be9fd}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--bg2);color:var(--muted)}
.pill.ok{background:var(--okbg);color:var(--oktx)}
.pill.ng{background:var(--ngbg);color:var(--ngtx)}
.pill.warn{background:var(--warnbg);color:var(--warntx)}

/* ---------- quiz ---------- */
.quiz{max-width:880px;margin-inline:auto;display:grid;gap:16px}
.qhead{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.qhead .bar{flex:1;height:8px;background:var(--bg2);border-radius:999px;overflow:hidden}
.qhead .bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.qcard{display:grid;gap:14px}
.qtext{font-size:clamp(17px,2.4vw,21px);font-weight:700;line-height:1.6}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:16px;text-align:left;display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:.15s;color:var(--text);line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:var(--bg2);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:14px}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ng);background:var(--ngbg)}
.opt.wrong .k{background:var(--ng);color:#fff}
.opt:disabled{cursor:default;opacity:.85}
.expl{border-radius:14px;padding:14px 16px;display:grid;gap:8px;animation:fadeup .3s ease both}
.expl.ok{background:var(--okbg);border:1.5px solid var(--okln)}
.expl.ng{background:var(--ngbg);border:1.5px solid var(--ngln)}
.expl .verdict{font-family:var(--display);font-weight:900;font-size:18px}
.expl.ok .verdict{color:var(--oktx)}.expl.ng .verdict{color:var(--ngtx)}
.result{text-align:center;display:grid;gap:14px;justify-items:center}
.result .score{font-family:var(--display);font-weight:900;font-size:clamp(44px,8vw,72px);color:var(--accent);line-height:1}
.result .score small{font-size:.4em;color:var(--muted)}
.ring{width:150px;height:150px}
.review{display:grid;gap:10px;text-align:left;width:100%}
.review .item{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14.5px;display:grid;gap:4px}
.review .item.ok{border-color:var(--okln)}
.review .item.ng{border-color:var(--ngln)}

/* ---------- 紙吹雪 ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:10px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}

/* ---------- widgets ---------- */
.switches{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sw{display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sw button{width:52px;height:64px;border-radius:12px;border:2px solid var(--line2);background:var(--paper);cursor:pointer;font:inherit;font-family:var(--mono);font-size:22px;font-weight:700;color:var(--faint);transition:.15s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.06)}
.sw button.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
.sw .w{font-family:var(--mono);font-weight:700}
.bigval{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.bigval div{text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 18px;min-width:120px}
.bigval .l{font-size:12px;color:var(--muted);font-weight:700}
.bigval .v{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--accent)}
.steps{display:grid;gap:6px;font-family:var(--mono);font-size:15px}
.steps div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 12px;opacity:0;transform:translateX(-8px);animation:slidein .35s ease forwards}
@keyframes slidein{to{opacity:1;transform:none}}
.sorter{display:grid;gap:12px;justify-items:center}
.sorter .item{font-family:var(--display);font-weight:900;font-size:22px;background:var(--paper);border:2px solid var(--line2);border-radius:16px;padding:16px 26px;min-width:220px;text-align:center;box-shadow:var(--shadow);animation:fadeup .3s}
.sorter .bins{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sorter .bins .btn{min-width:110px}
.scoreline{font-size:14px;color:var(--muted)}
.tree{font-family:var(--mono);font-size:15px;line-height:1.9;display:grid;gap:2px}
.tree .node{display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:8px;cursor:pointer;border:1.5px solid transparent;width:max-content;max-width:100%}
.tree .node:hover{background:var(--accent-soft)}
.tree .node.cur{background:var(--accent);color:#fff}
.tree .node.target{border-color:var(--c6);background:var(--pinkbg)}
.tree .node.cur.target{background:var(--c6);color:#fff}
.sheet{overflow-x:auto}
.sheet table{border-collapse:collapse;font-family:var(--mono);font-size:14px;min-width:520px}
.sheet th{background:var(--bg2);font-weight:700;color:var(--muted);padding:4px 8px;border:1px solid var(--line2);text-align:center;font-size:12.5px}
.sheet td{border:1px solid var(--line2);padding:0;min-width:96px;height:34px;background:var(--paper);position:relative}
.sheet td input{width:100%;height:34px;border:0;background:transparent;font:inherit;padding:0 8px;color:var(--text);outline:none}
.sheet td.sel{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.sheet td.ref{background:var(--warnbg)}
.sheet td.rng{background:var(--accent-soft)}
.sheet:focus{outline:2px solid var(--accent);outline-offset:2px}
.sheet td input::selection{background:var(--accent);color:#fff}
.sheet td.err input{color:var(--ng)}
.sheet td.num input{text-align:right}
.fbar{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:14px}
.fbar .addr{background:var(--bg2);padding:6px 10px;border-radius:8px;font-weight:700;min-width:48px;text-align:center}
.fbar input{flex:1;font-family:var(--mono)}
.dbtbl{overflow-x:auto}
.dbtbl table{border-collapse:collapse;font-size:14px;min-width:360px}
.dbtbl th{background:var(--accent-soft);color:var(--accent);padding:6px 10px;border:1px solid var(--line2);text-align:left;white-space:nowrap}
.dbtbl td{padding:5px 10px;border:1px solid var(--line2);white-space:nowrap;background:var(--paper)}
.dbtbl tr.hit td{background:var(--warnbg)}
.dbtbl th.pk::after{content:" 🔑";font-size:12px}
.dbtbl th.fk::after{content:" 🔗";font-size:12px}
.dbtbl td.dim,.dbtbl th.dim{opacity:.28}
.dbtbl caption{caption-side:top;text-align:left;font-weight:700;font-size:13px;color:var(--muted);padding:4px 0}
.layers{display:grid;gap:8px;max-width:420px;margin-inline:auto}
.layer{font-family:var(--display);font-weight:900;text-align:center;padding:14px;border-radius:12px;border:2px solid var(--line2);background:var(--paper);cursor:pointer;transition:.2s;font-size:16px}
.layer.placed{cursor:default}
.layer.slot{border-style:dashed;color:var(--faint);font-weight:700;background:var(--paper2)}
.tl{display:grid;gap:6px}
.tl .lane{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px;font-size:13.5px;font-weight:700}
.tl .track{height:22px;background:var(--bg2);border-radius:6px;position:relative;overflow:hidden}
.tl .track i{position:absolute;top:0;bottom:0;border-radius:6px}
.tl .cursor{position:absolute;top:0;bottom:0;width:3px;background:var(--text);left:0}
.rgbbox{width:100%;height:90px;border-radius:14px;border:1px solid var(--line);transition:background .1s;display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.pxcanvas{width:100%;max-width:260px;image-rendering:pixelated;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:block;margin-inline:auto}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.matchgrid .col{display:grid;gap:8px}
.mbtn{font:inherit;font-size:14px;font-weight:700;padding:10px;border-radius:12px;border:2px solid var(--line2);background:var(--paper);cursor:pointer;text-align:center;transition:.15s;color:var(--text)}
.mbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.mbtn.done{border-color:var(--ok);background:var(--okbg);color:var(--oktx);cursor:default}
.mbtn.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.wave{width:100%;height:auto;display:block}
.cmp{display:grid;gap:8px}
.cmp .bar{display:grid;grid-template-columns:120px 1fr 90px;gap:10px;align-items:center;font-size:13.5px;font-weight:700}
.cmp .bar i{display:block;height:16px;border-radius:6px;background:var(--accent);transform-origin:left;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.tokenline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.byte{font-family:var(--mono);font-size:13.5px;background:var(--paper);border:1.5px solid var(--line2);border-radius:8px;padding:3px 8px}
.byte.u{border-color:var(--c2);background:var(--c2s)}
.status{min-height:1.6em;font-weight:700}
.status.ok{color:var(--ok)}.status.ng{color:var(--ng)}
.chart-sel{display:flex;gap:6px;flex-wrap:wrap}
.reset{font-size:12.5px;color:var(--faint);background:none;border:0;cursor:pointer;text-decoration:underline}
footer{margin-top:40px;text-align:center;font-size:12.5px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{.topbar,.chnav,.chend,.lab{display:none}}

.sec .card>*,.prose>*,.two>*,.grid>*,.lab,.lab-body,.lab-body>*,.stack>*,.quiz>*{min-width:0}
.prose,.prose li,.prose p,.point,.why,.expl,.review .item{overflow-wrap:break-word;line-break:strict}

code{white-space:nowrap}
.readout{max-width:100%}

      <tr><td><b>入力装置</b></td><td>外からデータや指示を受け取る</td><td>キーボード、マウス、タッチパネル、スキャナ、マイク</td></tr>
      <tr><td><b>記憶装置</b></td><td>プログラムとデータをたくわえる（主記憶と補助記憶）</td><td>メモリ（RAM）、SSD、HDD</td></tr>
      <tr><td><b>演算装置</b></td><td>四則演算や比較（大小・等しい）を行う</td><td rowspan="2">CPU（中央処理装置）</td></tr>
      <tr><td><b>制御装置</b></td><td>プログラムの命令を解読し、他の装置に指示を出す</td></tr>
      <tr><td><b>出力装置</b></td><td>処理の結果を外に出す</td><td>ディスプレイ、プリンタ、スピーカ</td></tr></table>
      <div class="point"><b>ポイント</b><span>演算装置と制御装置をまとめて <b>CPU</b> とよびます。プログラムもデータも、いったん<b>主記憶装置</b>に置いてから CPU が処理します（プログラム内蔵方式）。</span></div>
      <details class="why"><summary>なぜ「主記憶」と「補助記憶」に分かれているの？</summary><p>CPU はとても高速なので、それに近い速さで読み書きできるメモリ（主記憶）が必要です。しかし高速なメモリは高価で、しかも電源を切ると内容が消えます（揮発性）。そこで、電源を切っても残り（不揮発性）、安く大容量にできる SSD や HDD を「補助記憶」として組み合わせています。</p></details>
    </div>${FIG_FIVE}` },
  { title:"CPU（中央処理装置）の性能", short:"CPU", widget:"clock", labTitle:"クロック周波数を変えてみよう",
    html:`<div class="prose">
      <p>CPU は「コンピュータの頭脳」。<b>制御装置＋演算装置</b> のはたらきをする部品で、主記憶から命令を1つずつ取り出して（フェッチ）、解読し（デコード）、実行する、をくり返しています。</p>
      <ul>
        <li><b>クロック周波数</b>：CPU が動作のタイミングを合わせる信号（クロック）が1秒間に何回打たれるか。単位は <b>Hz（ヘルツ）</b>。3 GHz なら 1秒間に 30億回。<mark>同じ設計の CPU なら、クロック周波数が高いほど処理が速い</mark>。</li>
        <li><b>コア数</b>：CPU の中にある「処理を行う部分」の数。マルチコアなら複数の処理を同時に進められる。</li>
        <li><b>ビット数（32ビット／64ビット）</b>：CPU が一度に扱えるデータの幅。64ビット CPU は扱えるメモリの量も大きい。</li>
        <li><b>キャッシュメモリ</b>：CPU と主記憶の速度差を埋めるため、CPU の近くに置く小さくて速いメモリ。</li>
      </ul>
      <details class="why"><summary>クロック周波数が同じなら性能も同じ？</summary><p>いいえ。1クロックで進められる仕事の量は CPU の設計（アーキテクチャ）によって違います。またコア数やキャッシュの量も性能に大きく影響します。クロック周波数は「同じ設計どうしを比べるときの目安」と覚えておきましょう。</p></details>
    </div>` },
  { title:"記憶装置の階層（メモリの種類）", short:"記憶の階層", widget:"memHier", labTitle:"取り出す速さを比べてみよう",
    html:`<div class="prose">
      <p>記憶装置は「速いが高くて小さい」ものと「遅いが安くて大きい」ものを組み合わせて使います。これを <b>記憶階層</b> といいます。</p>
      ${FIG_PYRAMID}
      <table><tr><th>種類</th><th>主な用途</th><th>特徴</th></tr>
      <tr><td><b>RAM</b>（Random Access Memory）</td><td>主記憶</td><td>読み書き自由。<b>揮発性</b>（電源を切ると消える）</td></tr>
      <tr><td>　DRAM</td><td>主記憶（メインメモリ）</td><td>安価で大容量。定期的な再書き込み（リフレッシュ）が必要</td></tr>
      <tr><td>　SRAM</td><td>キャッシュメモリ</td><td>高速だが高価。リフレッシュ不要</td></tr>
      <tr><td><b>ROM</b>（Read Only Memory）</td><td>起動プログラム（ファームウェア）など</td><td>読み出し専用。<b>不揮発性</b></td></tr>
      <tr><td><b>フラッシュメモリ</b></td><td>SSD、USB メモリ、SD カード</td><td>書き換えできる不揮発性メモリ</td></tr></table>
      <div class="point"><b>覚え方</b><span>「揮発」はガソリンが蒸発するイメージ。<b>揮発性＝電源を切ると消える</b>。主記憶（RAM）は揮発性、だからファイルは補助記憶に「保存」する必要があります。</span></div>
    </div>` },
  { title:"補助記憶装置のいろいろ", short:"補助記憶",
    html:`<div class="prose">
      <table><tr><th>装置</th><th>しくみ</th><th>長所</th><th>短所</th></tr>
      <tr><td><b>HDD</b>（ハードディスク）</td><td>磁気ディスクを回転させ、磁気ヘッドで読み書き</td><td>大容量で安い</td><td>機械部品があるので遅く、衝撃に弱い、音がする</td></tr>
      <tr><td><b>SSD</b></td><td>フラッシュメモリに電気的に記録</td><td>高速、静か、衝撃に強い、省電力</td><td>容量あたりの価格は HDD より高い、書き換え回数に上限</td></tr>
      <tr><td><b>光ディスク</b>（CD／DVD／BD）</td><td>レーザ光でディスク表面を読む</td><td>安価で配布・保存に向く</td><td>容量が小さい（CD 約700MB、DVD 4.7GB、BD 25GB ※片面1層）、遅い</td></tr>
      <tr><td><b>USB メモリ・SD カード</b></td><td>フラッシュメモリ</td><td>小さくて持ち運びやすい</td><td>紛失・破損しやすい</td></tr></table>
      <details class="why"><summary>SSD が HDD より速い根拠は？</summary><p>HDD は「目的の場所までヘッドを動かし、ディスクが回ってくるのを待つ」という<b>機械的な動作</b>が必要で、これに数ミリ秒かかります。SSD は電気信号だけでデータの場所にアクセスできるので、待ち時間が桁ちがいに短くなります（およそ0.1ミリ秒以下）。</p></details>
    </div>` },
  { title:"入出力装置とインタフェース", short:"入出力", widget:"sorter", labTitle:"仕分けゲーム：この装置はどれ？",
    html:`<div class="prose">
      <p>コンピュータ本体の外側でデータの出し入れをする機器を <b>周辺機器</b> といいます。本体とつなぐ規格（接続の決まり）を <b>インタフェース</b> といいます。</p>
      <table><tr><th>インタフェース</th><th>用途・特徴</th></tr>
      <tr><td><b>USB</b></td><td>最も一般的な有線接続。キーボード、マウス、USB メモリ、プリンタなど。電源を入れたまま抜き差しできる（ホットプラグ）。給電もできる。</td></tr>
      <tr><td><b>HDMI</b></td><td>映像と音声をデジタルのまま1本で送る。ディスプレイ・プロジェクタ・テレビ。</td></tr>
      <tr><td><b>Bluetooth</b></td><td>近距離（約10m）の無線。イヤホン、マウス、キーボード。</td></tr>
      <tr><td><b>Wi-Fi（無線 LAN）</b></td><td>無線でネットワークにつなぐ。後期に詳しく学びます。</td></tr></table>
      <div class="point"><b>分類のコツ</b><span>「コンピュータ<b>に入れる</b>」なら入力装置、「コンピュータ<b>から出す</b>」なら出力装置。タッチパネルは、指の位置を入力するセンサと、表示する画面（出力）が組み合わさったものです。</span></div>
    </div>` },
  ]},

/* ============================================================ 2. デジタルデータ */
{ id:"data", no:2, icon:"binary", title:"デジタルデータの表し方", lead:"2進数・16進数・単位・文字・画像・音",
  intro:"コンピュータの中では、文字も画像も音も、すべて 0 と 1 の並びで表されています。「なぜ 0 と 1 なのか」「どうやって数・文字・画像・音を 0 と 1 にするのか」を、スイッチを動かしながら思い出しましょう。",
  sections:[
  { title:"アナログとデジタル、ビットとバイト", short:"ビットとバイト", widget:"bits", labTitle:"8個のスイッチで数を作ろう",
    html:`<div class="prose">
      <p><b>アナログ</b>は連続的に変化する量（時計の針、水銀の温度計）、<b>デジタル</b>は飛び飛びの値（数字）で表したものです。コンピュータは電気の ON／OFF で情報を扱うので、<b>2進数（0 と 1）</b> がもっとも都合がよいのです。</p>
      <ul>
        <li><b>1ビット（bit）</b>：0 か 1 の1けた。情報の最小単位。</li>
        <li><b>1バイト（byte）</b>＝ <b>8ビット</b>。2<sup>8</sup> ＝ <b>256</b> 通りを表せる（0〜255）。</li>
        <li>一般に n ビットで <b>2<sup>n</sup></b> 通り。ビットが1つ増えるごとに表せる数は2倍になる。</li>
      </ul>
      <div class="point"><b>2進数の各けたの重み</b><span>右から 1, 2, 4, 8, 16, 32, 64, 128 … と、けたが上がるごとに2倍。10進数の 1, 10, 100 … の「10」が「2」になっただけです。</span></div>
    </div>` },
  { title:"基数変換（2進数・10進数・16進数）", short:"基数変換", widget:"radix", labTitle:"10進数を入れると、変換の手順をアニメーションで表示",
    html:`<div class="prose">
      <ul>
        <li><b>2進数 → 10進数</b>：各けたに重みを掛けて足す。例：1011<sub>(2)</sub> ＝ 8＋0＋2＋1 ＝ 11。</li>
        <li><b>10進数 → 2進数</b>：2 で割った<b>余り</b>を、商が 0 になるまで書き出し、<b>下から順に</b>読む。</li>
        <li><b>16進数</b>：0〜9 のあとに A〜F（10〜15）を使う。2進数 <b>4けたが 16進数 1けた</b>にぴったり対応するので、長い 2進数を短く書くために使う（例：1111 1010<sub>(2)</sub> ＝ FA<sub>(16)</sub> ＝ 250）。</li>
      </ul>
      <table><tr><th>10進</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td><td>14</td><td>15</td></tr>
      <tr><th>2進</th><td>0000</td><td>0001</td><td>0010</td><td>0011</td><td>0100</td><td>0101</td><td>0110</td><td>0111</td><td>1000</td><td>1001</td><td>1010</td><td>1011</td><td>1100</td><td>1101</td><td>1110</td><td>1111</td></tr>
      <tr><th>16進</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>A</td><td>B</td><td>C</td><td>D</td><td>E</td><td>F</td></tr></table>
      <details class="why"><summary>なぜ「2で割った余り」で2進数になるの？</summary><p>10進数の 13 を 2 で割ると「6 余り 1」。この余り 1 は「2 でまとめられずに残った 1 のけた」、つまり 2進数の最下位のけたです。商の 6 をさらに 2 で割ると、次のけたが決まります。これをくり返すと、下のけたから順に決まっていくので「下から読む」のです。</p></details>
    </div>` },
  { title:"データ量の単位と補助単位", short:"単位", widget:"units", labTitle:"バイト数を入れると、単位を換算",
    html:`<div class="prose">
      <table><tr><th>記号</th><th>読み</th><th>大きさ</th><th>記号</th><th>読み</th><th>大きさ</th></tr>
      <tr><td>k</td><td>キロ</td><td>10<sup>3</sup>（千）</td><td>m</td><td>ミリ</td><td>10<sup>-3</sup></td></tr>
      <tr><td>M</td><td>メガ</td><td>10<sup>6</sup>（百万）</td><td>μ</td><td>マイクロ</td><td>10<sup>-6</sup></td></tr>
      <tr><td>G</td><td>ギガ</td><td>10<sup>9</sup>（十億）</td><td>n</td><td>ナノ</td><td>10<sup>-9</sup></td></tr>
      <tr><td>T</td><td>テラ</td><td>10<sup>12</sup>（一兆）</td><td>p</td><td>ピコ</td><td>10<sup>-12</sup></td></tr></table>
      <p>大きい単位はデータ量（バイト）や周波数（Hz）に、小さい単位は時間（秒）に使います。例：3 GHz ＝ 3×10<sup>9</sup> Hz、アクセス時間 10 ns ＝ 10×10<sup>-9</sup> 秒。</p>
      <div class="point"><b>1024 の話</b><span>コンピュータでは 2<sup>10</sup> ＝ 1024 を「キロ」として扱う場面もあります（メモリ容量など）。区別するときは <b>KiB（キビバイト）＝1024 バイト</b>、<b>kB＝1000 バイト</b> と書きます。試験では「1 kB ＝ 1000 バイト」「1 KiB ＝ 1024 バイト」のように問題文の指定に従いましょう。</span></div>
    </div>` },
  { title:"負の数の表し方（2の補数）", short:"補数",
    html:`<div class="prose">
      <p>コンピュータにはマイナス記号がありません。そこで <b>2の補数</b> という表し方で負の数を扱います。</p>
      <ol>
        <li>絶対値を2進数で書く：5 → 0000 0101</li>
        <li>0 と 1 を反転する：1111 1010</li>
        <li>1 を足す：<b>1111 1011</b> ＝ −5</li>
      </ol>
      <p>こうすると <b>引き算を足し算で計算できます</b>。3 − 5 は 3 ＋ (−5) ＝ 0000 0011 ＋ 1111 1011 ＝ 1111 1110 ＝ −2。8ビットの2の補数で表せる範囲は <b>−128〜127</b> です。<b>先頭のビットが 1 なら負の数</b>と分かります。</p>
      <div class="point"><b>体験</b><span>2-1 のスイッチのコーナーで「2の補数」モードに切りかえると、同じビット列が負の数として読める様子を確かめられます。</span></div>
    </div>` },
  { title:"文字の表し方（文字コード）", short:"文字コード", widget:"charcode", labTitle:"文字を入れると、コンピュータの中の数（バイト列）を表示",
    html:`<div class="prose">
      <p>文字も、1文字ずつ番号（<b>文字コード</b>）を決めて数で表します。どの番号がどの文字かを決めた表が「文字コード体系」です。</p>
      <table><tr><th>文字コード</th><th>特徴</th></tr>
      <tr><td><b>ASCII</b></td><td>7ビットで 128 文字。英数字と記号。「A」＝ 65（16進で 41）。世界中の文字コードの基礎。</td></tr>
      <tr><td><b>JIS／Shift_JIS／EUC-JP</b></td><td>日本語（ひらがな・カタカナ・漢字）を <b>2バイト</b>で表す、日本独自の体系。</td></tr>
      <tr><td><b>Unicode</b>（UTF-8、UTF-16）</td><td>世界中の文字を1つの表に集めたもの。<b>UTF-8</b> は Web の標準で、英数字は1バイト、日本語はふつう3バイト、絵文字は4バイト。</td></tr></table>
      <details class="why"><summary>「文字化け」はなぜ起こる？</summary><p>書いた側と読む側で<b>ちがう文字コード表</b>を使うと、同じ数がちがう文字に対応づけられてしまうからです。たとえば Shift_JIS で保存した「あ」（82 A0）を UTF-8 として読むと、対応する文字がなく意味不明な記号になります。</p></details>
    </div>` },
  { title:"画像の表し方", short:"画像", widget:"image", labTitle:"色と解像度を動かしてみよう",
    html:`<div class="prose">
      <p>画像は小さな点（<b>画素、ピクセル</b>）の集まりで、各画素の色を数で表します。</p>
      <ul>
        <li><b>解像度</b>：画素の数（例：1920×1080）。多いほど細かい表現ができるがデータ量も増える。</li>
        <li><b>色の表し方</b>：光の三原色 <b>R（赤）G（緑）B（青）</b> の強さを組み合わせる（<b>加法混色</b>。全部最大で白）。各色を 8ビット（0〜255）で表すと 8×3 ＝ <b>24ビット</b>、2<sup>24</sup> ＝ <b>約1677万色</b>（フルカラー）。</li>
        <li><b>データ量</b>＝ 画素数 × 1画素あたりのビット数。例：1920×1080 画素 × 24ビット ＝ 49,766,400 ビット ≒ <b>6.2 MB</b>（圧縮しない場合）。</li>
        <li><b>ファイル形式</b>：JPEG（写真向き・非可逆圧縮）、PNG（可逆圧縮・透明あり）、GIF（256色・アニメ）。</li>
      </ul>
      <div class="point"><b>色深度と色数</b><span>1ビット → 2色、8ビット → 256 色、24ビット → 16,777,216 色。ビットが1つ増えると色数は2倍です。</span></div>
    </div>` },
  { title:"音の表し方（標本化・量子化・符号化）", short:"音", widget:"sound", labTitle:"サンプリング周波数と量子化ビット数を動かしてみよう",
    html:`<div class="prose">
      <p>音（空気の振動）はアナログな波です。これをデジタルにするには、次の3ステップ（<b>PCM</b> 方式）を行います。</p>
      <ol>
        <li><b>標本化（サンプリング）</b>：一定の時間ごとに波の高さを測る。1秒間に測る回数が<b>サンプリング周波数</b>（CD は 44.1 kHz ＝ 1秒に 44,100 回）。</li>
        <li><b>量子化</b>：測った高さを、決められた段階（目盛り）のうち一番近い値に丸める。段階の細かさが<b>量子化ビット数</b>（CD は 16 ビット ＝ 65,536 段階）。</li>
        <li><b>符号化</b>：その値を 2進数で表す。</li>
      </ol>
      <p><b>データ量</b>＝ サンプリング周波数 × 量子化ビット数 × チャネル数 × 秒数。CD 音質（44.1 kHz、16 ビット、ステレオ 2ch）の1秒 ＝ 44,100×16×2 ＝ 1,411,200 ビット ≒ <b>176 kB</b>。</p>
      <details class="why"><summary>サンプリング周波数はなぜ 44.1 kHz？</summary><p>人が聞こえる音は最高で約 20 kHz。「元の波を再現するには、最高周波数の<b>2倍以上</b>の周波数で標本化する必要がある」という<b>標本化定理</b>から、20 kHz の 2 倍＝40 kHz より少し余裕をもたせて 44.1 kHz が選ばれました。</p></details>
    </div>` },
  ]},

/* ============================================================ 3. ファイルとディレクトリ */
{ id:"file", no:3, icon:"folder", title:"ファイルとディレクトリ", lead:"階層構造・パス・拡張子・圧縮とバックアップ",
  intro:"コンピュータはデータを「ファイル」という単位で保存し、「ディレクトリ（フォルダ）」で整理します。ファイルの場所を正確に指し示す「パス」の書き方を、木をたどりながら復習します。",
  sections:[
  { title:"ファイルとディレクトリの階層構造", short:"階層構造",
    html:`<div class="prose">
      <ul>
        <li><b>ファイル</b>：データやプログラムを保存する単位。名前がついている。</li>
        <li><b>ディレクトリ</b>（Windows では<b>フォルダ</b>）：ファイルやディレクトリを入れる「入れ物」。中にディレクトリを入れられるので、<b>階層構造（木構造）</b>になる。</li>
        <li><b>ルートディレクトリ</b>：いちばん上（根っこ）のディレクトリ。「/」（Windows では「C:\\」など）で表す。</li>
        <li><b>サブディレクトリ</b>：あるディレクトリの中にあるディレクトリ。</li>
        <li><b>カレントディレクトリ</b>：今、自分が作業している（いる）ディレクトリ。</li>
      </ul>
      ${FIG_TREE}
      <div class="point"><b>なぜ階層にするの？</b><span>ファイルが何千個もあると、平らに並べただけでは探せません。「学部 → 学科 → 学年」のように分類しておけば、同じ名前のファイルも別の場所なら共存できます。</span></div>
    </div>` },
  { title:"パス（絶対パスと相対パス）", short:"パス", widget:"path", labTitle:"木の中を移動して、パスを答えよう",
    html:`<div class="prose">
      <p><b>パス</b>はファイルやディレクトリの「住所」。ディレクトリ名を区切り文字（<b>/</b>、Windows は <b>\\</b>）でつないで書きます。</p>
      <table><tr><th></th><th>絶対パス</th><th>相対パス</th></tr>
      <tr><th>起点</th><td><b>ルート</b>から</td><td><b>カレントディレクトリ</b>から</td></tr>
      <tr><th>書き方</th><td>先頭が「/」で始まる<br><code>/home/taro/report.txt</code></td><td>先頭に「/」がない<br><code>taro/report.txt</code>（カレントが /home のとき）</td></tr>
      <tr><th>特徴</th><td>どこにいても同じ書き方で確実</td><td>短く書ける。カレントが変わると指す先も変わる</td></tr></table>
      <ul>
        <li><code>.</code>（ドット1つ）＝ カレントディレクトリ自身</li>
        <li><code>..</code>（ドット2つ）＝ 1つ上（親）のディレクトリ。<code>../hanako/memo.txt</code> は「1つ上に行って、hanako の中の memo.txt」</li>
      </ul>
      <div class="point"><b>見分け方</b><span>先頭が「/」なら絶対パス、そうでなければ相対パス。相対パスは「今いる場所」がわからないと解けないので、問題文のカレントディレクトリを必ず確認しましょう。</span></div>
    </div>` },
  { title:"拡張子とファイル形式", short:"拡張子", widget:"ext", labTitle:"拡張子マッチング",
    html:`<div class="prose">
      <p>ファイル名の末尾の「.」以降を <b>拡張子</b> といい、ファイルの種類（形式）を表します。OS は拡張子を見て、開くアプリを決めます。</p>
      <table><tr><th>種類</th><th>拡張子</th></tr>
      <tr><td>テキスト</td><td>.txt（文字だけ）、.csv（カンマ区切りの表データ）、.html（Web ページ）</td></tr>
      <tr><td>文書・表・発表</td><td>.docx（Word）、.xlsx（Excel）、.pptx（PowerPoint）、.pdf（配布用文書）</td></tr>
      <tr><td>画像</td><td>.jpg／.jpeg（写真）、.png（図・透明）、.gif（アニメ）、.svg（ベクタ画像）</td></tr>
      <tr><td>音声・動画</td><td>.mp3、.wav（音声）、.mp4（動画）</td></tr>
      <tr><td>圧縮</td><td>.zip（複数ファイルをまとめて圧縮）</td></tr>
      <tr><td>プログラム</td><td>.exe（Windows の実行ファイル）、.py、.js など（ソースコード）</td></tr></table>
      <p class="small muted">ワイルドカード：<code>*.jpg</code> のように「*」を使うと「拡張子が jpg のすべてのファイル」を表せます（「?」は任意の1文字）。</p>
    </div>` },
  { title:"圧縮・バックアップ・アクセス権", short:"圧縮と管理",
    html:`<div class="prose">
      <ul>
        <li><b>圧縮</b>：データ量を減らすこと。<b>可逆圧縮</b>（ZIP、PNG：完全に元に戻せる）と<b>非可逆圧縮</b>（JPEG、MP3：人が気づきにくい情報を捨てて大きく減らす。元には戻らない）がある。</li>
        <li><b>バックアップ</b>：故障・誤操作・ウイルスに備えて、データの複製を別の場所に保存すること。<b>フルバックアップ</b>（全部）、<b>差分</b>（前回のフルからの変化分）、<b>増分</b>（前回のバックアップからの変化分）。</li>
        <li><b>アクセス権</b>：ファイルごとに「誰が」「読む・書く・実行する」をできるかを決めるしくみ。共有のコンピュータで、他人のファイルを勝手に書き換えられないようにする。</li>
      </ul>
      <div class="point"><b>3-2-1 ルール</b><span>大切なデータは <b>3</b>つのコピーを、<b>2</b>種類以上の媒体に、うち<b>1</b>つは別の場所（クラウドなど）に。USB メモリ1本だけに保存するのは「バックアップ」とはいえません。</span></div>
    </div>` },
  ]},

/* ============================================================ 4. OS とアプリケーション */
{ id:"os", no:4, icon:"layers", title:"OSとアプリケーション", lead:"ソフトウェアの分類・OSの役割・UI・ライセンス",
  intro:"ハードウェアは、ソフトウェアがなければただの箱です。ソフトウェアを「基本ソフト（OS）」と「応用ソフト（アプリ）」に分け、OS が裏側で何をしているのかを、積み木とタイムラインで確かめます。",
  sections:[
  { title:"ソフトウェアの分類（層の構造）", short:"ソフトの分類", widget:"layers", labTitle:"積み木を正しい順に積もう",
    html:`<div class="prose">
      <p>ソフトウェアは、ハードウェアの上に<b>層（レイヤ）</b>のように積み重なっています。</p>
      ${FIG_LAYERS}
      <ul>
        <li><b>基本ソフトウェア（OS：オペレーティングシステム）</b>：ハードウェアを直接管理し、アプリに共通の機能を提供する。Windows、macOS、Linux、iOS、Android など。</li>
        <li><b>ミドルウェア</b>：OS とアプリの中間で、多くのアプリが共通に使う機能を提供する。DBMS（データベース管理システム）、Web サーバなど。</li>
        <li><b>応用ソフトウェア（アプリケーション）</b>：利用者の目的に直接役立つソフト。ワープロ、表計算、ブラウザ、ゲームなど。</li>
      </ul>
      <div class="point"><b>なぜ層に分けるの？</b><span>アプリを作る人が、キーボードの読み取りやディスクへの書き込みを毎回ゼロから作るのは大変です。OS がその部分を引き受け、<b>API</b>（アプリから OS の機能を呼び出す窓口）として提供することで、どのアプリも同じやり方でハードウェアを使えます。</span></div>
    </div>` },
  { title:"OS の役割", short:"OSの役割", widget:"multitask", labTitle:"マルチタスク：CPU はどう切りかえている？",
    html:`<div class="prose">
      <table><tr><th>役割</th><th>内容</th></tr>
      <tr><td><b>ハードウェアの管理</b></td><td>CPU・メモリ・入出力装置を管理する。周辺機器ごとの制御プログラムを <b>デバイスドライバ</b> という。</td></tr>
      <tr><td><b>タスク（プロセス）管理</b></td><td>複数のプログラムを同時に動かしているように見せる（<b>マルチタスク</b>）。CPU の時間を細かく区切って順番に割り当てる。</td></tr>
      <tr><td><b>メモリ管理</b></td><td>各プログラムに主記憶を割り当てる。主記憶が足りないとき、補助記憶の一部をメモリのように使う（<b>仮想記憶</b>）。</td></tr>
      <tr><td><b>ファイル管理</b></td><td>ディレクトリ構造、アクセス権、読み書き（第3章）。</td></tr>
      <tr><td><b>ユーザ管理</b></td><td>ユーザ名とパスワードによるログイン、権限の管理。</td></tr>
      <tr><td><b>ユーザインタフェースの提供</b></td><td>GUI や CUI（次のセクション）。</td></tr></table>
      <details class="why"><summary>マルチタスクの根拠：本当に「同時」に動いているの？</summary><p>1つのコアは、ある瞬間には1つの命令しか実行できません。OS は、たとえば数ミリ秒ごとにプログラムを切りかえます（<b>タイムスライス</b>）。切りかえが人間には速すぎるので、同時に動いているように見えるのです。マルチコア CPU なら、コアの数だけ本当に同時に実行できます。</p></details>
    </div>` },
  { title:"いろいろな OS とユーザインタフェース", short:"OSとUI", widget:"osmatch", labTitle:"OS の名前と説明を結ぼう",
    html:`<div class="prose">
      <table><tr><th>OS</th><th>特徴</th></tr>
      <tr><td><b>Windows</b></td><td>Microsoft 社。パソコン用として最も普及。</td></tr>
      <tr><td><b>macOS</b></td><td>Apple 社。Mac 用。UNIX 系。</td></tr>
      <tr><td><b>Linux</b></td><td>オープンソース（OSS）の UNIX 系 OS。サーバやスーパーコンピュータ、組込み機器で広く使われる。</td></tr>
      <tr><td><b>iOS ／ Android</b></td><td>スマートフォン・タブレット用。Android は Linux をもとにした OSS。</td></tr></table>
      <p><b>ユーザインタフェース（UI）</b>：人とコンピュータのやりとりの方法。</p>
      <ul>
        <li><b>GUI</b>（Graphical User Interface）：アイコンやウィンドウをマウスやタッチで操作。直感的。</li>
        <li><b>CUI</b>（Character User Interface）：キーボードから文字でコマンドを入力。自動化や遠隔操作に強い。</li>
      </ul>
    </div>` },
  { title:"アプリケーションとソフトウェアのライセンス", short:"ライセンス",
    html:`<div class="prose">
      <p>ソフトウェアは著作物です。買ったのは「使う権利（<b>使用許諾、ライセンス</b>）」であって、コピーして配る権利ではありません。</p>
      <table><tr><th>区分</th><th>内容</th></tr>
      <tr><td><b>OSS</b>（オープンソースソフトウェア）</td><td>ソースコード（プログラムの設計図）が公開され、ライセンスの条件のもとで自由に利用・改変・再配布できる。Linux、Firefox など。</td></tr>
      <tr><td><b>フリーウェア</b></td><td>無料で使えるが、ソースコードは公開されていないことが多い。</td></tr>
      <tr><td><b>シェアウェア</b></td><td>試用は無料、継続して使うなら料金を払う。</td></tr>
      <tr><td><b>パッケージ／サブスクリプション</b></td><td>買い切りで使う／月額・年額で使う権利を借りる（Microsoft 365 など）。</td></tr>
      <tr><td><b>サイトライセンス</b></td><td>学校や企業など、組織の中で人数を限定せず使える契約。</td></tr></table>
      <div class="point"><b>注意</b><span>「無料＝何をしてもよい」ではありません。OSS にもライセンス（GPL、MIT など）があり、改変して配るときの条件が決められています。</span></div>
    </div>` },
  ]},

/* ============================================================ 5. 表計算ソフト */
{ id:"sheet", no:5, icon:"grid", title:"表計算ソフト", lead:"セル・数式・関数・相対参照と絶対参照・グラフ",
  intro:"表計算ソフト（Excel など）は「セルに数式を書くと、参照先が変わったとき自動で計算し直してくれる」道具です。この章では、本物のように動くミニ表計算で、数式のコピーと参照のしくみを体験します。",
  sections:[
  { title:"セルと番地、数式の基本", short:"セルと数式",
    html:`<div class="prose">
      <ul>
        <li>表のマス目を <b>セル</b>、横の並びを <b>行</b>（1, 2, 3…）、縦の並びを <b>列</b>（A, B, C…）という。</li>
        <li>セルの位置は「列＋行」で <b>A1</b>、<b>C5</b> のように表す（<b>セル番地</b>）。範囲は <b>A1:C3</b> のように「:」でつなぐ。</li>
        <li>数式は <b>=（イコール）</b> で始める。<code>=A1+B1</code>、<code>=B2*C2</code>。演算子は + − * /、べき乗は ^。</li>
        <li>数式にセル番地を書くことを <b>参照</b> という。参照先の値が変わると、数式の結果も自動で変わる。</li>
      </ul>
      <div class="point"><b>値を直接書かず、参照を使う理由</b><span>「単価×数量」を <code>=120*3</code> と書くと、単価が変わるたびに数式を書き直すことになります。<code>=B2*C2</code> と書いておけば、B2 を直すだけで済み、ミスも減ります。</span></div>
    </div>` },
  { title:"よく使う関数", short:"関数", widget:"sheet", labTitle:"ミニ表計算：数式を入力してみよう（数式は = で始める）",
    html:`<div class="prose">
      <table><tr><th>関数</th><th>意味</th><th>例</th></tr>
      <tr><td><b>SUM</b></td><td>合計</td><td><code>=SUM(B2:B6)</code></td></tr>
      <tr><td><b>AVERAGE</b></td><td>平均</td><td><code>=AVERAGE(B2:B6)</code></td></tr>
      <tr><td><b>MAX ／ MIN</b></td><td>最大値／最小値</td><td><code>=MAX(B2:B6)</code></td></tr>
      <tr><td><b>COUNT</b></td><td>数値が入っているセルの個数</td><td><code>=COUNT(B2:B6)</code></td></tr>
      <tr><td><b>IF</b></td><td>条件によって値を変える</td><td><code>=IF(B2>=60,"合格","不合格")</code></td></tr>
      <tr><td><b>ROUND</b></td><td>四捨五入（けた数を指定）</td><td><code>=ROUND(B2/3,1)</code></td></tr>
      <tr><td><b>INT ／ MOD</b></td><td>整数部分／割り算の余り</td><td><code>=MOD(7,3)</code> → 1</td></tr></table>
      <p class="small muted">関数の書き方：<b>関数名(引数1, 引数2, …)</b>。引数にはセル番地・範囲・数値・文字列（"　"で囲む）を指定します。</p>
    </div>` },
  { title:"相対参照と絶対参照", short:"相対と絶対", widget:"refcopy", labTitle:"数式をコピーすると、参照はどう変わる？",
    html:`<div class="prose">
      <p>数式をほかのセルに<b>コピー</b>すると、セル番地は「コピー先との位置関係を保ったまま」自動的にずれます。これを <b>相対参照</b> といいます。</p>
      <p>ずれてほしくないセル（税率、単価表など）には <b>$</b> をつけて <b>絶対参照</b> にします。</p>
      <table><tr><th>書き方</th><th>意味</th><th>D2 から D3 にコピーすると</th></tr>
      <tr><td><code>A1</code></td><td>相対参照（列も行もずれる）</td><td><code>A2</code></td></tr>
      <tr><td><code>$A$1</code></td><td>絶対参照（列も行も固定）</td><td><code>$A$1</code></td></tr>
      <tr><td><code>A$1</code></td><td>行だけ固定（複合参照）</td><td><code>A$1</code></td></tr>
      <tr><td><code>$A1</code></td><td>列だけ固定（複合参照）</td><td><code>$A2</code></td></tr></table>
      <div class="point"><b>覚え方</b><span><b>$ は「くぎ」</b>。$ の直後にある列名や行番号がくぎで打ちつけられて動かなくなる、と考えます。<code>A$1</code> は「1 行目にくぎ」、<code>$A1</code> は「A 列にくぎ」。</span></div>
    </div>` },
  { title:"グラフの選び方", short:"グラフ", widget:"charts", labTitle:"目的に合うグラフを選ぼう",
    html:`<div class="prose">
      <table><tr><th>グラフ</th><th>向いている目的</th><th>例</th></tr>
      <tr><td><b>棒グラフ</b></td><td>項目どうしの<b>量の比較</b></td><td>商品ごとの売上</td></tr>
      <tr><td><b>折れ線グラフ</b></td><td>時間による<b>変化・推移</b></td><td>月ごとの気温</td></tr>
      <tr><td><b>円グラフ</b></td><td>全体に対する<b>割合</b>（構成比）</td><td>アンケートの回答割合</td></tr>
      <tr><td><b>散布図</b></td><td>2つの量の<b>関係（相関）</b></td><td>身長と体重</td></tr>
      <tr><td><b>レーダーチャート</b></td><td>複数項目の<b>バランス</b></td><td>教科ごとの成績</td></tr></table>
      <p class="small muted">そのほか：<b>並べ替え</b>（ソート：昇順・降順）、<b>フィルタ</b>（条件に合う行だけ表示）も表計算の基本機能です。</p>
    </div>` },
  ]},

/* ============================================================ 6. データベース */
{ id:"db", no:6, icon:"db", title:"データベース", lead:"DBMS・関係データベース・主キー・SQL・トランザクション",
  intro:"データベースは「たくさんのデータを、矛盾なく、みんなで安全に使う」ためのしくみです。表のつくり、主キーと外部キー、SQL による取り出し、同時更新を防ぐ排他制御まで、実際に動かして思い出しましょう。",
  sections:[
  { title:"データベースと DBMS", short:"DBMS",
    html:`<div class="prose">
      <ul>
        <li><b>データベース（DB）</b>：目的に合わせて整理し、共有して使えるようにしたデータの集まり。</li>
        <li><b>DBMS</b>（データベース管理システム）：データベースを管理するソフトウェア（ミドルウェア）。データの<b>一元管理</b>、<b>同時アクセス制御</b>、<b>アクセス権管理</b>、<b>障害からの回復</b>などを行う。</li>
        <li><b>関係データベース（リレーショナルデータベース、RDB）</b>：データを<b>表（テーブル）</b>の形で管理する方式。現在もっとも広く使われている。</li>
      </ul>
      <div class="point"><b>表計算ソフトと何がちがう？</b><span>表計算は1人が1つのファイルを扱うのが基本。DBMS は<b>多数の利用者が同時に</b>読み書きしても矛盾が起きないように制御し、データの重複や食いちがいを防ぐ設計（正規化）を前提にしています。</span></div>
    </div>` },
  { title:"表の構造：主キーと外部キー", short:"主キー", widget:"keys", labTitle:"主キーになれる列はどれ？",
    html:`<div class="prose">
      <ul>
        <li>表の横1行を <b>行（レコード）</b>、縦1列を <b>列（フィールド、項目）</b> という。</li>
        <li><b>主キー</b>：1行を<b>一意に</b>（ただ1つに）特定できる列。<b>重複がなく、空（NULL）でもいけない</b>。学生番号、商品コードなど。</li>
        <li><b>外部キー</b>：<b>他の表の主キー</b>を参照する列。表と表を関連づける（例：注文表の「学生番号」は学生表の主キーを指す）。</li>
        <li>2つ以上の列を組み合わせて主キーにすることもある（<b>複合キー</b>）。</li>
      </ul>
      <details class="why"><summary>なぜ「氏名」は主キーに向かないの？</summary><p>同姓同名の人がいると、1行に特定できないからです。また、改姓で値が変わる可能性もあります。主キーには「重複せず、変わらず、必ず値がある」列（またはそのために作った番号）を使います。</p></details>
    </div>` },
  { title:"正規化：重複をなくして矛盾を防ぐ", short:"正規化", widget:"normalize", labTitle:"1つの表 vs 分けた表：値を書きかえてみよう",
    html:`<div class="prose">
      <p><b>正規化</b>とは、データの<b>重複をなくす</b>ように表を分割し、更新のときに矛盾が起きないようにする設計の手順です。</p>
      <ul>
        <li>1つの表に「学生番号・氏名・科目名・担当教員」を全部入れると、同じ学生の氏名が何度も現れる（<b>冗長</b>）。</li>
        <li>その学生の氏名を直すとき、1か所でも直し忘れると<b>食いちがい（更新異常）</b>が起こる。</li>
        <li>「学生」「科目」「履修」のように表を分け、<b>主キーと外部キー</b>でつなげば、氏名は1か所にしかないので矛盾しない。</li>
      </ul>
      <p class="small muted">表と表の関係（1対多など）を図にしたものを <b>E-R 図</b>（実体関連図）といいます。</p>
    </div>` },
  { title:"データの取り出し：関係演算と SQL", short:"SQL", widget:"sql", labTitle:"SQL を書いて、表から取り出してみよう",
    html:`<div class="prose">

const h = (tag, attrs={}, ...kids)=>{ const el=document.createElement(tag); for(const k in attrs){ if(k==="class") el.className=attrs[k]; else if(k==="html") el.innerHTML=attrs[k]; else if(k.startsWith("on")) el.addEventListener(k.slice(2), attrs[k]); else el.setAttribute(k, attrs[k]); } kids.flat().forEach(c=>{ if(c!=null) el.append(c); }); return el; };
const shuffle = a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ---------- 6-5 排他制御 ---------- */
WIDGETS.lock = function(el){
  let lock=true, running=false; const seg=h("div",{class:"seg"}); const b1=h("button",{class:"on", onclick:()=>{lock=true; sel();}},"ロックあり"), b2=h("button",{onclick:()=>{lock=false; sel();}},"ロックなし"); seg.append(b1,b2);
  function sel(){ b1.classList.toggle("on",lock); b2.classList.toggle("on",!lock); }
  const seat=h("div",{class:"bigval"}), logA=h("div",{class:"steps"}), logB=h("div",{class:"steps"}), status=h("div",{class:"status"});
  let seats=1, resv=0;
  function show(){ seat.innerHTML=`<div><div class="l">残席</div><div class="v">${seats}</div></div><div><div class="l">予約件数</div><div class="v">${resv}</div></div><div><div class="l">ロック</div><div class="v" style="font-size:18px">${lockedBy||"なし"}</div></div>`; }
  let lockedBy="";
  function add(log, t, cls){ log.append(h("div",{class:cls||"", html:t})); }
  async function run(){ if(running) return; running=true; seats=1; resv=0; lockedBy=""; logA.innerHTML=""; logB.innerHTML=""; status.textContent=""; show();
    if(!lock){
      add(logA,"👩 A：残席を読む → <b>1</b>（空いている！）"); await sleep(700); add(logB,"👨 B：残席を読む → <b>1</b>（空いている！）"); await sleep(700);
      add(logA,"👩 A：残席を 0 に更新して予約確定"); seats=0; resv++; show(); await sleep(700);
      add(logB,"👨 B：残席を 0 に更新して予約確定"); seats=0; resv++; show(); await sleep(500);
      status.className="status ng"; status.innerHTML="❌ 残席 1 なのに予約が 2 件 ── <b>ダブルブッキング</b>。B が読んだ「1」は、A の更新前の古い値でした。";
    } else {
      add(logA,"👩 A：残席データに<b>ロック</b>をかける 🔒"); lockedBy="A"; show(); await sleep(600); add(logA,"👩 A：残席を読む → <b>1</b>"); await sleep(600);
      add(logB,"👨 B：ロックをかけようとする → <span style='color:var(--warn)'>A が使用中。待つ… ⏳</span>"); await sleep(900);
      add(logA,"👩 A：残席を 0 に更新 → コミット → ロック解除 🔓"); seats=0; resv++; lockedBy=""; show(); await sleep(700);
      add(logB,"👨 B：ロックをかける 🔒 → 残席を読む → <b>0</b>"); lockedBy="B"; show(); await sleep(700);
      add(logB,"👨 B：満席なので予約できない → ロールバック → ロック解除 🔓"); lockedBy=""; show(); await sleep(400);
      status.className="status ok"; status.innerHTML="⭕ 予約は 1 件だけ。B は A の処理が終わるまで<b>待たされ</b>、最新の値（0）を読めたので矛盾が起きません。";
    } running=false; }
  show();
  el.append(h("div",{class:"row"}, seg, h("button",{class:"btn primary", onclick:run},"▶ A と B が同時に「最後の 1 席」を予約する")), seat, h("div",{class:"two"}, h("div",{}, h("b",{},"👩 A さんの処理"), logA), h("div",{}, h("b",{},"👨 B さんの処理"), logB)), status);
};
})();

/* ============================================================
   app.js  ── 画面の切り替え・進捗の保存・クイズエンジン
   ============================================================ */
(function(){
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const app = $("#app");
const KEY = "gairon1review.v1";

/* ---------- 進捗（localStorage） ---------- */
const P = load();
function load(){
  try{ const j = JSON.parse(localStorage.getItem(KEY)||"{}"); return Object.assign({visited:{}, best:{}, finalBest:null, finals:0}, j); }
  catch(e){ return {visited:{}, best:{}, finalBest:null, finals:0}; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} updateTopProgress(); }
function visitedSet(ch){ return new Set(P.visited[ch]||[]); }
function markVisited(ch, i){ const s = visitedSet(ch); s.add(i); P.visited[ch]=[...s]; save(); }
function unmarkVisited(ch, i){ const s = visitedSet(ch); s.delete(i); P.visited[ch]=[...s]; save(); }
function chapterProgress(ch){
  const c = CHAPTERS.find(x=>x.id===ch); const n = c.sections.length;
  const v = visitedSet(ch).size; const quizDone = P.best[ch]!=null;
  return {pct: Math.round(100*(v + (quizDone?1:0))/(n+1)), read:v, total:n, quizDone, best:P.best[ch]};
}
function totalProgress(){
  let sum=0; CHAPTERS.forEach(c=>sum+=chapterProgress(c.id).pct);
  return Math.round(sum/CHAPTERS.length);
}
function updateTopProgress(){
  const t = totalProgress();
  $("#pprog").style.width = t+"%"; $("#pprog-label").textContent = t+"%";
}

/* ---------- バッジ ---------- */
const BADGES = [
  {id:"first", e:"🔰", name:"はじめの一歩", desc:"どれか1つのセクションを読んだ", test:()=>CHAPTERS.some(c=>visitedSet(c.id).size>0)},
  {id:"quiz1", e:"✅", name:"確認クイズ合格", desc:"章の確認クイズで80%以上", test:()=>CHAPTERS.some(c=>P.best[c.id]!=null && P.best[c.id].pct>=80)},
  {id:"perfect", e:"💯", name:"パーフェクト", desc:"章の確認クイズで全問正解", test:()=>CHAPTERS.some(c=>P.best[c.id]!=null && P.best[c.id].pct===100)},
  {id:"half", e:"🏃", name:"折り返し", desc:"全体の進みぐあい50%", test:()=>totalProgress()>=50},
  {id:"allread", e:"📚", name:"全章読破", desc:"6章すべてのセクションを読んだ", test:()=>CHAPTERS.every(c=>visitedSet(c.id).size>=c.sections.length)},
  {id:"final", e:"🎓", name:"総合テスト合格", desc:"総合テストで80%以上", test:()=>P.finalBest!=null && P.finalBest.pct>=80},
  {id:"master", e:"👑", name:"概論Ⅰマスター", desc:"進みぐあい100%かつ総合テスト90%以上", test:()=>totalProgress()===100 && P.finalBest!=null && P.finalBest.pct>=90},
];

/* ---------- ルーティング ---------- */
function setAccent(c){
  document.documentElement.style.setProperty("--accent", c ? `var(--c${c.no})` : "var(--c1)");
  document.documentElement.style.setProperty("--accent-soft", c ? `var(--c${c.no}s)` : "var(--c1s)");
}
function route(){
  const h = (location.hash||"#home").slice(1);
  const [name, arg] = h.split("-");
  window.scrollTo({top:0, behavior:"instant"});
  if(name==="ch"){ const c = CHAPTERS.find(x=>x.id===arg); if(c) return renderChapter(c); }
  if(name==="quiz"){ const c = CHAPTERS.find(x=>x.id===arg); if(c) return renderQuiz(c); }
  if(name==="final") return renderFinal();
  renderHome();
}
window.addEventListener("hashchange", route);

/* ---------- ホーム ---------- */
function renderHome(){
  setAccent(null);
  document.title = "コンピュータ概論Ⅰ ふりかえりラボ";
  const cards = CHAPTERS.map(c=>{
    const pr = chapterProgress(c.id);
    const badge = pr.quizDone && pr.best.pct===100 ? "💯" : pr.quizDone && pr.best.pct>=80 ? "✅" : "";
    return `<button class="chcard" style="--accent:var(--c${c.no});--accent-soft:var(--c${c.no}s)" data-go="#ch-${c.id}">
      <span class="badge">${badge}</span>
      <span class="icon">${ICONS[c.icon]}</span>
      <span class="no">CHAPTER ${c.no}</span>
      <h3>${c.title}</h3>
      <span class="muted small">${c.lead}</span>
      <span class="pbar"><i style="width:${pr.pct}%"></i></span>
      <span class="meta"><span>読んだ ${pr.read}/${pr.total}</span><span>${pr.quizDone ? "クイズ最高 "+pr.best.pct+"%" : "クイズ 未挑戦"}</span></span>
    </button>`;
  }).join("");
  const badges = BADGES.map(b=>`<div class="bdg ${b.test()?"":"locked"}" title="${b.desc}"><span class="e">${b.e}</span><span>${b.name}<br><span class="small muted" style="font-weight:400">${b.desc}</span></span></div>`).join("");
  const fb = P.finalBest;
  app.innerHTML = `<div class="view">
    <section class="hero">
      <div class="stack">
        <span class="eyebrow">コンピュータ概論Ⅱ 第1回</span>
        <h1>前期のまとめ<br>コンピュータ概論Ⅰ ふりかえりラボ</h1>
        <p class="lead">前期に学んだ6つの分野を、<b>アニメーションと体験コーナー</b>で思い出し、<b>クイズ</b>で自分の理解を確かめましょう。順番は自由です。気になる章から始めてください。</p>
        <div class="row">
          <a class="btn primary lg" href="#ch-hw">CHAPTER 1 から始める</a>
          <a class="btn lg" href="#final">いきなり総合テスト</a>
        </div>
        <p class="small muted">進みぐあいと最高得点は、このブラウザに自動保存されます。<button class="reset" id="resetAll">記録をすべて消す</button><span id="resetBox" hidden> 読んだ印・最高得点・実績をすべて消します。<button class="btn sm" id="resetYes">消す</button> <button class="btn sm" id="resetNo">やめる</button></span></p>
      </div>
      <div class="art">${ICONS.hero}</div>
    </section>
    <h2 style="margin-bottom:14px">6つの分野</h2>
    <div class="chapters">${cards}</div>
    <section class="final-cta">
      <div class="stack">
        <h2>🎓 総合テスト</h2>
        <p>6分野からランダムに ${FINAL_N} 問。前期のまとめとして、自分の弱いところを見つけましょう。${fb ? `<br>これまでの最高：<b style="color:#fff">${fb.pct}%</b>（${fb.score}/${fb.n} 問）・挑戦 ${P.finals} 回` : ""}</p>
      </div>
      <a class="btn lg" href="#final" style="background:#fff;color:#1d2b64;border-color:transparent">テストを始める</a>
    </section>
    <h2 style="margin-top:30px">実績</h2>
    <div class="badges">${badges}</div>
  </div>`;
  app.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click", ()=>location.hash=b.dataset.go));
  $("#resetAll").addEventListener("click", ()=>{
    const box = $("#resetBox"); box.hidden = false; $("#resetAll").hidden = true;
  });
  $("#resetYes").addEventListener("click", ()=>{ P.visited={}; P.best={}; P.finalBest=null; P.finals=0; save(); renderHome(); });
  $("#resetNo").addEventListener("click", ()=>{ $("#resetBox").hidden = true; $("#resetAll").hidden = false; });
  updateTopProgress();
}

/* ---------- 章 ---------- */
function renderChapter(c){
  setAccent(c);
  document.title = `${c.no}. ${c.title} ── 概論Ⅰ ふりかえりラボ`;
  const v = visitedSet(c.id);
  const nav = c.sections.map((s,i)=>`<a href="#s${i+1}" data-i="${i}" class="${v.has(i)?"done":""}">${c.no}-${i+1} ${s.short||s.title}</a>`).join("");
  const secs = c.sections.map((s,i)=>`<section class="sec" id="s${i+1}">
    <div class="card">
      <h2><span class="n">${c.no}-${i+1}</span>${s.title}</h2>
      ${s.html}
      ${s.widget ? `<div class="lab" data-widget="${s.widget}"><div class="lab-title">${s.labTitle||"体験してみよう"}</div><div class="lab-body"></div></div>` : ""}
      <div class="secfoot"><label class="check"><input type="checkbox" data-sec="${i}" ${v.has(i)?"checked":""}> 読んだ・理解した</label></div>
    </div>
  </section>`).join("");
  const pr = chapterProgress(c.id);
  const prev = CHAPTERS[c.no-2], next = CHAPTERS[c.no];
  app.innerHTML = `<div class="view">
    <a class="btn ghost sm" href="#home">← ホームへ</a>
    <div class="chhead" style="margin-top:10px">
      <span class="icon">${ICONS[c.icon]}</span>
      <div><span class="eyebrow">CHAPTER ${c.no}</span><h1>${c.title}</h1></div>
    </div>
    <p class="muted">${c.intro}</p>
    <nav class="chnav" aria-label="この章の目次">${nav}</nav>
    ${secs}
    <div class="chend card">
      <span class="eyebrow">CHECK</span>
      <h2>確認クイズ（${c.quiz.length}問）</h2>
      <p class="muted">この章の内容から出題します。${pr.quizDone ? `これまでの最高：<b>${pr.best.pct}%</b>` : "まだ挑戦していません。"}</p>
      <a class="btn primary lg" href="#quiz-${c.id}">クイズに挑戦する</a>
      <div class="row" style="margin-top:8px">
        ${prev ? `<a class="btn sm" href="#ch-${prev.id}">← ${prev.no}. ${prev.title}</a>` : ""}
        ${next ? `<a class="btn sm" href="#ch-${next.id}">${next.no}. ${next.title} →</a>` : `<a class="btn sm" href="#final">総合テストへ →</a>`}
      </div>
    </div>
  </div>`;
  // 目次リンク：ハッシュを変えずにスクロール
  app.querySelectorAll(".chnav a").forEach(a=>a.addEventListener("click", e=>{
    e.preventDefault(); const t = $(a.getAttribute("href")); if(t) t.scrollIntoView({behavior:"smooth", block:"start"});
  }));
  // 読んだチェック
  app.querySelectorAll("input[data-sec]").forEach(cb=>cb.addEventListener("change", ()=>{
    const i = +cb.dataset.sec; if(cb.checked) markVisited(c.id,i); else unmarkVisited(c.id,i);
    const a = app.querySelector(`.chnav a[data-i="${i}"]`); a.classList.toggle("done", cb.checked);
  }));
  // 表を横スクロール可能な枠で包む（狭い画面でページ全体が横に広がらないように）
  app.querySelectorAll(".prose table").forEach(t=>{ const w=document.createElement("div"); w.className="tblwrap"; t.replaceWith(w); w.append(t); });
  // 体験コーナーを初期化
  app.querySelectorAll("[data-widget]").forEach(el=>{
    const fn = WIDGETS[el.dataset.widget];
    if(fn){ try{ fn(el.querySelector(".lab-body"), c); }catch(err){ console.error(err); el.querySelector(".lab-body").innerHTML = `<p class="small muted">この体験コーナーを表示できませんでした。</p>`; } }
  });
  updateTopProgress();
}

/* ---------- クイズ ---------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function renderQuiz(c){ setAccent(c); document.title = `確認クイズ：${c.title}`; runQuiz({title:`${c.no}. ${c.title} 確認クイズ`, qs: shuffle(c.quiz), back:`#ch-${c.id}`, backLabel:"章にもどる", onDone:(score,n)=>{
  const pct = Math.round(100*score/n); const b = P.best[c.id];
  if(!b || pct>b.pct) P.best[c.id] = {pct, score, n}; save();
}}); }
function renderFinal(){
  setAccent(null); document.title = "総合テスト ── 概論Ⅰ ふりかえりラボ";
  // 各章から均等に出題
  const per = Math.floor(FINAL_N/CHAPTERS.length); let qs=[];
  CHAPTERS.forEach(c=>{ qs = qs.concat(shuffle(c.quiz).slice(0,per).map(q=>Object.assign({ch:c}, q))); });
  const rest = FINAL_N - qs.length;
  if(rest>0){ const pool = shuffle(CHAPTERS.flatMap(c=>c.quiz.map(q=>Object.assign({ch:c},q)))).filter(q=>!qs.includes(q)); qs = qs.concat(pool.slice(0,rest)); }
  runQuiz({title:"総合テスト", qs: shuffle(qs), back:"#home", backLabel:"ホームへ", showChapter:true, onDone:(score,n)=>{
    const pct = Math.round(100*score/n); P.finals++;
    if(!P.finalBest || pct>P.finalBest.pct) P.finalBest = {pct, score, n}; save();
  }});
}
function runQuiz(o){
  const qs = o.qs; let i=0, score=0; const log=[];
  const shell = document.createElement("div"); shell.className="view quiz"; app.innerHTML=""; app.appendChild(shell);
  function showQ(){
    const q = qs[i];
    const opts = shuffle(q.a.map((t,k)=>({t, ok:k===0})));
    const chAccent = o.showChapter && q.ch ? `style="--accent:var(--c${q.ch.no});--accent-soft:var(--c${q.ch.no}s)"` : "";
    shell.innerHTML = `<div class="qhead"><a class="btn ghost sm" href="${o.back}">✕ やめる</a><span class="bar"><i style="width:${100*i/qs.length}%"></i></span><span class="num">${i+1} / ${qs.length}</span></div>
      <div class="card qcard" ${chAccent}>
        <div class="row"><span class="tag">${o.showChapter && q.ch ? "CH."+q.ch.no+" "+q.ch.title : o.title}</span>${q.tag?`<span class="pill">${q.tag}</span>`:""}</div>
        <p class="qtext">${q.q}</p>
        <div class="opts">${opts.map((op,k)=>`<button class="opt" data-ok="${op.ok?1:0}"><span class="k">${"ABCD"[k]}</span><span>${op.t}</span></button>`).join("")}</div>
        <div id="expl"></div>
        <p class="small muted">キーボード：<kbd>A</kbd>〜<kbd>D</kbd> または <kbd>1</kbd>〜<kbd>4</kbd> で回答、<kbd>Enter</kbd> で次へ</p>
      </div>`;
    const btns = [...shell.querySelectorAll(".opt")];
    btns.forEach(b=>b.addEventListener("click", ()=>answer(b)));
    function answer(b){
      if(btns[0].disabled) return;
      const ok = b.dataset.ok==="1"; if(ok) score++;
      btns.forEach(x=>{ x.disabled=true; if(x.dataset.ok==="1") x.classList.add("correct"); });
      if(!ok) b.classList.add("wrong");
      log.push({q, ok, chosen:b.querySelector("span:last-child").textContent});
      $("#expl", shell).innerHTML = `<div class="expl ${ok?"ok":"ng"}"><div class="verdict">${ok?"⭕ 正解！":"❌ ざんねん"}</div><div>${!ok?`<b>正解：</b>${q.a[0]}<br>`:""}${q.e}</div>
        <div class="row"><button class="btn primary" id="next">${i+1<qs.length?"次の問題 →":"結果を見る"}</button></div></div>`;
      $("#next", shell).addEventListener("click", next); $("#next", shell).focus();
    }
    shell._key = (e)=>{
      if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
      const k = e.key.toUpperCase();
      if(!btns[0].disabled){ const idx = "ABCD".indexOf(k)>=0 ? "ABCD".indexOf(k) : "1234".indexOf(k); if(idx>=0 && btns[idx]) answer(btns[idx]); }
      else if(e.key==="Enter"){ e.preventDefault(); next(); }
    };
  }
  function next(){ i++; if(i<qs.length) showQ(); else finish(); }
  function finish(){
    const n = qs.length, pct = Math.round(100*score/n);
    o.onDone(score,n);
    const msg = pct===100 ? "完璧です！前期の内容をしっかり覚えていますね。" : pct>=80 ? "よくできました。まちがえた問題の解説をもう一度読んでおきましょう。" : pct>=60 ? "あと少し。まちがえた分野の章を読み直してから、もう一度挑戦しましょう。" : "まずは各章の体験コーナーで、しくみを動かして理解するところから始めましょう。";
    const r = 62, circ = 2*Math.PI*r;
    shell.innerHTML = `<div class="card result">
      <span class="eyebrow">RESULT</span>
      <svg class="ring" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--bg2)" stroke-width="14"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" transform="rotate(-90 75 75)" style="transition:stroke-dashoffset 1s ease .2s" id="ring"/><text x="75" y="84" text-anchor="middle" font-family="var(--display)" font-weight="900" font-size="30" fill="var(--accent)">${pct}%</text></svg>
      <div class="score">${score}<small> / ${n} 問</small></div>
      <p>${msg}</p>
      <div class="row"><button class="btn primary" id="again">もう一度</button><a class="btn" href="${o.back}">${o.backLabel}</a></div>
      <h3 style="margin-top:10px">ふりかえり</h3>
      <div class="review">${log.map((l,k)=>`<div class="item ${l.ok?"ok":"ng"}"><div><b>${l.ok?"⭕":"❌"} Q${k+1}.</b> ${l.q.q}</div><div class="small"><b>正解：</b>${l.q.a[0]}${!l.ok?` ／ <span class="muted">あなたの答え：${l.chosen}</span>`:""}</div><div class="small muted">${l.q.e}</div>${o.showChapter&&l.q.ch?`<div><a class="small" href="#ch-${l.q.ch.id}">→ CH.${l.q.ch.no} ${l.q.ch.title} を読み直す</a></div>`:""}</div>`).join("")}</div>
    </div>`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ $("#ring",shell).style.strokeDashoffset = circ*(1-pct/100); }));
    $("#again", shell).addEventListener("click", ()=>route());
    shell._key = null;
    if(pct>=80) confetti();
    updateTopProgress();
  }
  document.onkeydown = (e)=>{ if(shell.isConnected && shell._key) shell._key(e); };
  showQ();
}
function confetti(){
  const box = document.createElement("div"); box.className="confetti";
  const cols = ["#3b7be9","#8b5cf6","#f0a020","#22a36b","#0e9fb0","#e5567a"];
  for(let k=0;k<90;k++){ const i=document.createElement("i"); i.style.left=Math.random()*100+"vw"; i.style.background=cols[k%cols.length]; i.style.animationDelay=(Math.random()*.8)+"s"; i.style.transform=`rotate(${Math.random()*360}deg)`; box.appendChild(i); }
  document.body.appendChild(box); setTimeout(()=>box.remove(), 3600);
}

route();
})();

</script>
